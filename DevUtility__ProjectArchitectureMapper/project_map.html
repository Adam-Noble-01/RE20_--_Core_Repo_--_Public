<script>

var width = window.innerWidth;
var height = window.innerHeight;
var svg = d3.select('#graph')
    .attr('width', width)
    .attr('height', height);
var container = svg.append('g');

var zoom = d3.zoom()
  .scaleExtent([0.5, 5])
  .filter(function(event) {
    return event.type === 'wheel' ||
      (event.type === 'mousedown' && (event.button === 1 || event.button === 2));
  })
  .on('zoom', function(event) {
    container.attr('transform', event.transform);
  });

svg.call(zoom).on('contextmenu', function(e) { e.preventDefault(); });

var color = function(d){
  return d.type && svg.select('style').text().includes('.' + d.type) ? null : null;
};

var simulation = d3.forceSimulation(graph.nodes)
  .force('link', d3.forceLink(graph.edges).id(d => d.id).distance(60))
  .force('charge', d3.forceManyBody().strength(-200))
  .force('center', d3.forceCenter(width / 2, height / 2));

var link = container.append('g')
  .attr('stroke', '#999')
  .attr('stroke-opacity', 0.6)
  .selectAll('line')
  .data(graph.edges)
  .enter().append('line')
  .attr('stroke-width', 1);

var node = container.append('g')
  .attr('stroke', '#fff')
  .attr('stroke-width', 1.5)
  .selectAll('circle')
  .data(graph.nodes)
  .enter().append('circle')
  .attr('r', 6)
  .attr('class', d => d.type)
  .call(drag(simulation));

var label = container.append('g')
  .selectAll('text')
  .data(graph.nodes)
  .enter().append('text')
  .attr('dy', -8)
  .text(d => d.label.substring(d.label.lastIndexOf('/')+1));

simulation.on('tick', () => {
  link.attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

  node.attr('cx', d => d.x)
      .attr('cy', d => d.y);

  label.attr('x', d => d.x)
       .attr('y', d => d.y);
});

function drag(simulation) {
  function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }
  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }
  function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }
  return d3.drag()
    .on('start', dragstarted)
    .on('drag', dragged)
    .on('end', dragended);
}
</script>
