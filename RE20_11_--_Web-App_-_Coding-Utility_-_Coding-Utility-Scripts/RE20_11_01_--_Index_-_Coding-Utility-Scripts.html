    <!-- 
    ====================================================================================================================
    APPLICATION  |  Coding Utility Scripts Viewer
    FILE NAME    |  RE20_11_01_--_Index_-_Coding-Utility-Scripts_v1.1.0.html (Suggested Name)
    FILE TYPE    |  HTML/CSS/JS Single-File Web Application
    APP DETAILS  |  Displays code snippets fetched from GitHub based on an external configuration JSON. 
                 |  Allows users to easily browse and copy snippets, URLs, and local paths. Includes syntax highlighting.
    AUTHOR       |  Adam Noble - Studio NoodlFjord (Generated based on request)
    VERSION      |  1.1.0 
    ====================================================================================================================

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    SCRIPT DESCRIPTION

    This HTML file provides a viewer for code snippets defined in an external JSON configuration file.
    Key functionalities include:
    - Fetching configuration data from a specified URL (G_CONFIG_JSON_URL).
    - Dynamically generating a grid of snippet cards based on the fetched JSON data.
    - Fetching the actual code content for each snippet from its GitHub URL.
    - Displaying snippet metadata prioritizing Tool Name and Usage, with File Name less prominent.
    - Providing buttons to copy:
        - The code snippet content.
        - The GitHub URL of the snippet file.
        - The local directory path specified in the config.
    - Applying syntax highlighting using Prism.js for supported languages (Python, JS, HTML, CSS, Bash, PowerShell).
    - Utilizing a CSS naming convention (HEAD__, GRID__, CARD__, BTNS__, etc.).
    - Displaying loading and error states for configuration and code fetching.
    - Injecting the application version into the header.

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    ISSUES & LESSONS LEARNED  

    - CORS Requirement: Requires being served over HTTP/HTTPS due to fetching external JSON and code snippets.
    - Network Dependency: Relies on network access for both config and code snippets.
    - Clipboard API Limitations: Requires secure context (HTTPS/localhost).
    - JSON Structure Dependency: Assumes the specific structure of the external JSON config file.
    - Prism.js Dependency: Relies on Prism.js CDN for syntax highlighting. Requires mapping script types to Prism languages.
    - CSS Naming Convention Rigidity: Adhering strictly to the custom convention requires careful naming in both CSS and JS.

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    LOGIC ARCHITECTURE

    1. Initialization (`initApp` on DOMContentLoaded):
        - Caches essential DOM elements.
        - Injects the application version.
        - Calls `fetchConfigData` (async) to load JSON from `G_CONFIG_JSON_URL`.
    2. Config Fetching (`fetchConfigData`):
        - Uses `fetch()` to get the JSON.
        - Parses the response.
        - On success: Stores data in `G_APP_CONFIG_DATA`, calls `renderSnippetGrid`.
        - On error: Displays an error message in the grid area.
    3. Grid Rendering (`renderSnippetGrid`):
        - Iterates through `G_APP_CONFIG_DATA['script-files-data']`.
        - Creates HTML cards (`createSnippetCard`) using the new CSS convention and updated data display.
        - Appends cards to the grid.
        - Calls `fetchAndDisplayCode` asynchronously for each card.
    4. Code Fetching & Highlighting (`fetchAndDisplayCode`):
        - Fetches code from `script-file-github-url`.
        - On success:
            - Sets `codeElement.textContent`.
            - Determines Prism language using `mapTypeToPrismLanguage`.
            - Adds `language-xxxx` class to `codeElement`.
            - Calls `Prism.highlightElement(codeElement)`.
            - Enables the code copy button.
        - On error: Displays error message. Disables code copy button.
    5. Copy Functionality:
        - `handleCopyCodeClick`: Copies code content from the `<code>` element.
        - `handleGenericCopyClick`: Copies text (URL/Path) stored in the button's `dataset.copyText`.

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    VISUAL JAVASCRIPT FUNCTION FLOW (Simplified)

    DOMContentLoaded -> initApp() (async)
        ├── Cache DOM Elements (G_DOM_ELEMENTS)
        ├── injectVersionNote() -> Updates .HEAD__title
        ├── G_APP_CONFIG_DATA = await fetchConfigData(G_CONFIG_JSON_URL)
        │   ├── fetch(G_CONFIG_JSON_URL) -> Handle Success/Error
        │   └── (Error handling stops further execution)
        └── renderSnippetGrid(G_APP_CONFIG_DATA)
            ├── Loop through G_APP_CONFIG_DATA['script-files-data']
            │   ├── createSnippetCard(scriptData) -> cardElement (Using new classes)
            │   │   └── Adds metadata, pre/code block, all copy buttons
            │   ├── Append cardElement to #snippet-grid
            │   └── fetchAndDisplayCode(scriptData, codeElement, copyCodeButton) (async)
            │       ├── fetch(scriptData['script-file-github-url'])
            │       ├── Update codeElement.textContent
            │       ├── mapTypeToPrismLanguage() -> langClass
            │       ├── Add langClass to codeElement
            │       ├── Prism.highlightElement(codeElement)
            │       ├── Enable copyCodeButton -> handleCopyCodeClick()
            │       └── Add EventListeners to other copy buttons -> handleGenericCopyClick()
            └── (Grid Populates Asynchronously)

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    FUTURE SCRIPT IMPROVEMENTS & IDEAS

    - Search/Filter functionality.
    - Local Storage Caching for offline use/performance.
    - Theme switcher (including Prism theme).
    - More robust error handling and display.
    - Display `script-tool-notes`.
    - Loading indicator for initial JSON fetch.

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

    05-Apr-2024 - v1.0.0  |  Initial Version with embedded JSON.

                        - Fetches JSON configuration from external URL.

                        - Added "Copy URL" and "Copy Path" buttons.
                        - Reduced code block font size significantly (to 9px).
                        - Integrated Prism.js for syntax highlighting (Python, JS, HTML, CSS, Bash, PowerShell).
                        - Updated JS logic for external JSON and highlighting.

    <script>
        // =============================================================================================
        // JAVASCRIPT | GLOBAL VARIABLES & CONSTANTS
        // - Updated in v1.1.0
        // =============================================================================================
        const G_DOM_ELEMENTS = {
            appTitle: null,
            snippetGrid: null,
            gridMessage: null,
        };
        
        // URL for the external configuration JSON file
        const G_CONFIG_JSON_URL = 'https://raw.githubusercontent.com/Adam-Noble-01/RE20_--_Core_Repo_--_Public/main/RE20_11_--_Web-App_-_Coding-Utility_-_Coding-Utility-Scripts/RE20_11_02_--_DATA_-_Coding-Utility-Scripts-Config.json';
        
        // Global variable to hold the fetched config data
        let G_APP_CONFIG_DATA = null; 

        // =============================================================================================
        // JAVASCRIPT | HELPER FUNCTIONS
        // - Updated / Added functions in v1.1.0
        // =============================================================================================

        // ------------------------------------------------------------
        // HELPER FUNCTION | INJECT VERSION NOTE (Unchanged Logically)
        // - Reused from v1.0.0, targets updated CSS class
        // ------------------------------------------------------------
         function injectVersionNote(options = {}) {
             const config = {
                metaTagName: options.metaTagName || 'application-version',
                targetElementId: options.targetElementId || 'app-title', // Still using ID for targeting title itself
                prefix: options.prefix !== undefined ? options.prefix : ' - v', 
                suffix: options.suffix !== undefined ? options.suffix : '',
                style: options.style || {
                    fontSize: '12px',
                    color: '#656565',
                    fontWeight: 'normal'
                }
            };
            const targetElement = document.getElementById(config.targetElementId); 
             if (!targetElement) {
                console.error(`Error: Target element #${config.targetElementId} not found.`);
                return;
            }
            // ... rest of the function remains the same as v1.0.0 ...
            const metaTag = document.querySelector(`meta[name="${config.metaTagName}"]`);
            if (!metaTag) return;
            const versionString = metaTag.getAttribute('content');
            if (!versionString) return;
            console.log(`Injecting version: ${versionString}`);
            let baseTitle = '';
            for (let i = 0; i < targetElement.childNodes.length; i++) {
                if (targetElement.childNodes[i].nodeType === Node.TEXT_NODE) {
                    baseTitle = targetElement.childNodes[i].textContent.trim(); break;
                }
            }
             if (!baseTitle) { baseTitle = targetElement.textContent.split(config.prefix.trim())[0].trim() || 'App'; }
            const versionSpan = document.createElement('span');
            versionSpan.className = 'version-note'; // Keep class name generic
            versionSpan.textContent = `${config.prefix}${versionString}${config.suffix}`;
            for (const property in config.style) {
                if (config.style.hasOwnProperty(property)) { versionSpan.style[property] = config.style[property]; }
            }
            targetElement.innerHTML = ''; 
            targetElement.appendChild(document.createTextNode(baseTitle));
            targetElement.appendChild(versionSpan); 
        }

        // ------------------------------------------------------------
        // HELPER FUNCTION | MAP TYPE TO PRISM LANGUAGE
        // - Introduced in v1.1.0
        // DESCRIPTION: Maps file type strings from JSON to Prism.js language classes.
        // ARGUMENTS: fileType (String) - The script type from JSON.
        // RETURNS: (String) - The corresponding Prism language class (e.g., 'language-python'), or null if no match.
        // ------------------------------------------------------------
        function mapTypeToPrismLanguage(fileType) {
            if (!fileType) return null;
            const lowerType = fileType.toLowerCase();

            if (lowerType.includes('python')) return 'language-python';
            if (lowerType.includes('javascript') || lowerType.includes('js')) return 'language-javascript';
            if (lowerType.includes('html') || lowerType.includes('markup')) return 'language-markup';
            if (lowerType.includes('css')) return 'language-css';
            if (lowerType.includes('bash') || lowerType.includes('shell')) return 'language-bash';
            if (lowerType.includes('powershell')) return 'language-powershell';
            // Add more mappings as needed
            
            console.warn(`No Prism language mapping found for type: ${fileType}`);
            return null; // Default or no highlighting if type is unknown
        }


        // ------------------------------------------------------------
        // HELPER FUNCTION | CREATE SNIPPET CARD ELEMENT
        // - Updated in v1.1.0
        // DESCRIPTION: Creates HTML structure for a snippet card using new JSON fields and CSS classes.
        // ARGUMENTS: scriptData (Object), scriptKey (String)
        // RETURNS: (HTMLElement) - The card div element.
        // ------------------------------------------------------------
        function createSnippetCard(scriptData, scriptKey) {
            const card = document.createElement('div');
            card.className = 'CARD'; // Use new block class
            card.id = `snippet-${scriptKey}`; 

            // --- Card Content ---
            const title = document.createElement('h3');
            title.className = 'CARD__title'; // Element class
            title.textContent = scriptData['script-tool-name'] || scriptData['script-file-name'] || 'Unnamed Snippet'; // Prioritize tool name

            const usage = document.createElement('p');
            usage.className = 'CARD__usage'; // Element class
            usage.innerHTML = `<strong>Usage:</strong> ${scriptData['script-tool-usage'] || 'No usage information.'}`;

            const description = document.createElement('p');
            description.className = 'CARD__description'; // Element class
            description.innerHTML = `<strong>Description:</strong> ${scriptData['script-file-description'] || 'No description.'}`;
           
            const metaInfo = document.createElement('div');
            metaInfo.className = 'CARD__meta'; // Element class
            // Display file name less prominently in meta
            metaInfo.innerHTML = `
                <span class="CARD__meta-item"><strong>Type:</strong> ${scriptData['script-file-type'] || 'N/A'}</span>
                <span class="CARD__meta-item"><strong>Version:</strong> ${scriptData['script-file-version'] || 'N/A'}</span>
                <span class="CARD__meta-item"><strong>Added:</strong> ${scriptData['script-file-added'] || 'N/A'}</span>
                <span class="CARD__meta-item CARD__meta-filename"><strong>File:</strong> ${scriptData['script-file-name'] || 'N/A'}</span>
            `;

            // --- Code Block ---
            const pre = document.createElement('pre');
            pre.className = 'CARD__code-block line-numbers'; // Element class + Prism plugin class
            const code = document.createElement('code');
            code.className = 'CARD__code-content CARD__code-content--status'; // Element + Initial status modifier
            code.id = `code-${scriptKey}`; // ID for targeting
            code.textContent = 'Loading code...'; 
            pre.appendChild(code);

            // --- Buttons Container ---
             const buttonContainer = document.createElement('div');
             buttonContainer.className = 'BTNS'; // Buttons block

             // Copy Code Button (Positioned separately via CSS absolute positioning)
             const copyCodeButton = document.createElement('button');
             copyCodeButton.className = 'BTNS__item BTNS__item--code'; // Item + Modifier
             copyCodeButton.textContent = 'Copy Code';
             copyCodeButton.title = 'Copy code snippet to clipboard';
             copyCodeButton.disabled = true; 
             copyCodeButton.dataset.codeElementId = code.id; // Link to code element
             copyCodeButton.addEventListener('click', handleCopyCodeClick); // Specific handler
             
             // Copy URL Button
             const copyUrlButton = document.createElement('button');
             copyUrlButton.className = 'BTNS__item BTNS__item--url';
             copyUrlButton.textContent = 'Copy URL';
             copyUrlButton.title = 'Copy GitHub Raw URL';
             copyUrlButton.dataset.copyText = scriptData['script-file-github-url'] || ''; // Data to copy
             copyUrlButton.disabled = !scriptData['script-file-github-url']; // Disable if no URL
             copyUrlButton.addEventListener('click', handleGenericCopyClick); // Generic handler

             // Copy Path Button
             const copyPathButton = document.createElement('button');
             copyPathButton.className = 'BTNS__item BTNS__item--path';
             copyPathButton.textContent = 'Copy Path';
             copyPathButton.title = 'Copy Local Directory Path';
             copyPathButton.dataset.copyText = scriptData['script-file-local-dir'] || ''; // Data to copy
             copyPathButton.disabled = !scriptData['script-file-local-dir']; // Disable if no path
             copyPathButton.addEventListener('click', handleGenericCopyClick); // Generic handler

             // Append buttons to container (order matters for flex layout)
             buttonContainer.appendChild(copyUrlButton);
             buttonContainer.appendChild(copyPathButton);

             // --- Assemble Card ---
             // Add code copy button directly to pre for absolute positioning context if desired, or card root
             card.appendChild(title);
             card.appendChild(usage);
             card.appendChild(description);
             card.appendChild(metaInfo);
             card.appendChild(pre);      // Add code block
             pre.appendChild(copyCodeButton); // Add code copy button INSIDE pre
             card.appendChild(buttonContainer); // Add container with other buttons

            return card; 
        }

        // ------------------------------------------------------------
        // HELPER FUNCTION | FETCH AND DISPLAY CODE & HIGHLIGHT
        // - Updated in v1.1.0
        // DESCRIPTION: Fetches code, updates element, applies Prism highlighting.
        // ARGUMENTS: scriptData (Object), codeElement (HTMLElement), copyButton (HTMLElement)
        // ------------------------------------------------------------
        async function fetchAndDisplayCode(scriptData, codeElement, copyButton) {
            const url = scriptData['script-file-github-url'];
            const fileType = scriptData['script-file-type'];

            if (!url) {
                codeElement.textContent = 'Error: Missing GitHub URL.';
                codeElement.className = 'CARD__code-content CARD__code-content--error';
                copyButton.disabled = true; return;
            }
            if (!codeElement || !copyButton) { console.error("Missing elements for fetch/display."); return; }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const codeText = await response.text();
                
                codeElement.textContent = codeText; // Set raw text first
                
                // Determine Prism language and apply class
                const prismLangClass = mapTypeToPrismLanguage(fileType);
                codeElement.className = 'CARD__code-content'; // Reset classes first
                if (prismLangClass) {
                    codeElement.classList.add(prismLangClass); // Add language class
                } else {
                    codeElement.classList.add('language-none'); // Indicate no specific language
                }

                // Apply Prism highlighting
                if (typeof Prism !== 'undefined' && Prism.highlightElement) {
                    Prism.highlightElement(codeElement);
                } else {
                    console.warn("Prism.js not available for highlighting.");
                }

                copyButton.disabled = false; // Enable copy button
                console.log(`Fetched and highlighted: ${scriptData['script-file-name']}`);

            } catch (error) {
                console.error(`Failed to fetch/highlight code from ${url}:`, error);
                codeElement.textContent = `Error loading code: ${error.message}`;
                codeElement.className = 'CARD__code-content CARD__code-content--error'; 
                copyButton.disabled = true; 
            }
        }


        // =============================================================================================
        // JAVASCRIPT | EVENT HANDLERS
        // - Updated / Added handlers in v1.1.0
        // =============================================================================================

        // ------------------------------------------------------------
        // EVENT HANDLER | COPY CODE BUTTON CLICK (Specific Handler)
        // - Updated in v1.1.0
        // ------------------------------------------------------------
        async function handleCopyCodeClick(event) {
            const button = event.target;
            const codeElementId = button.dataset.codeElementId;
            const codeElement = document.getElementById(codeElementId);

            if (!codeElement) { console.error("Code element not found:", codeElementId); return; }

            const codeToCopy = codeElement.textContent;
            await performCopy(button, codeToCopy); // Use shared copy logic
        }

        // ------------------------------------------------------------
        // EVENT HANDLER | GENERIC COPY BUTTON CLICK (URL, Path)
        // - Introduced in v1.1.0
        // ------------------------------------------------------------
        async function handleGenericCopyClick(event) {
            const button = event.target;
            const textToCopy = button.dataset.copyText;

            if (textToCopy === undefined || textToCopy === null) { 
                console.error("No text found in data-copy-text attribute."); 
                return; 
            }

            await performCopy(button, textToCopy); // Use shared copy logic
        }

        // ------------------------------------------------------------
        // ASYNC HELPER | PERFORM COPY & PROVIDE FEEDBACK
        // - Introduced in v1.1.0 (Refactored from original copy handler)
        // ------------------------------------------------------------
         async function performCopy(buttonElement, textToCopy) {
             const originalButtonText = buttonElement.textContent;
             // Clear previous feedback classes immediately
             buttonElement.classList.remove('BTNS__item--copied', 'BTNS__item--error'); 

             try {
                 if (!navigator.clipboard || !window.isSecureContext) {
                      throw new Error('Clipboard API unavailable/insecure.');
                  }
                 await navigator.clipboard.writeText(textToCopy);
                 console.log('Text copied to clipboard:', textToCopy.substring(0, 50) + '...');
                 
                 // Success Feedback
                 buttonElement.textContent = 'Copied!';
                 buttonElement.classList.add('BTNS__item--copied');
                 setTimeout(() => {
                     buttonElement.textContent = originalButtonText;
                     buttonElement.classList.remove('BTNS__item--copied');
                 }, 1500); // Shorter delay

             } catch (err) {
                 console.error('Failed to copy:', err);
                 // Error Feedback
                 buttonElement.textContent = 'Copy Failed';
                 buttonElement.classList.add('BTNS__item--error');
                  setTimeout(() => {
                     buttonElement.textContent = originalButtonText;
                     buttonElement.classList.remove('BTNS__item--error');
                 }, 2500); 
             }
         }


        // =============================================================================================
        // JAVASCRIPT | CORE LOGIC FUNCTIONS
        // - Updated in v1.1.0
        // =============================================================================================
        
        // ------------------------------------------------------------
        // CORE FUNCTION | FETCH CONFIG DATA
        // - Introduced in v1.1.0
        // DESCRIPTION: Fetches and parses the JSON configuration file.
        // ARGUMENTS: url (String) - The URL of the JSON config.
        // RETURNS: (Promise<Object|null>) - Resolves with the parsed JSON data or null on error.
        // ------------------------------------------------------------
        async function fetchConfigData(url) {
            console.log(`Fetching configuration from: ${url}`);
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                console.log("Configuration loaded successfully.");
                return data;
            } catch (error) {
                console.error("Failed to fetch or parse configuration:", error);
                if (G_DOM_ELEMENTS.gridMessage) {
                    G_DOM_ELEMENTS.gridMessage.textContent = `Error loading configuration: ${error.message}. Please check the console and the config URL.`;
                    G_DOM_ELEMENTS.gridMessage.className = 'GRID__message GRID__message--error';
                }
                return null; // Indicate failure
            }
        }


        // ------------------------------------------------------------
        // CORE FUNCTION | RENDER SNIPPET GRID
        // - Updated in v1.1.0
        // DESCRIPTION: Renders snippet cards based on the fetched configuration data.
        // ARGUMENTS: configData (Object) - The loaded application configuration.
        // ------------------------------------------------------------
        function renderSnippetGrid(configData) {
            if (!G_DOM_ELEMENTS.snippetGrid) { console.error("Grid container not found."); return; }
            
            // Use the data passed as argument
            const scripts = configData?.['script-files-data']; 

            if (!scripts || Object.keys(scripts).length === 0) {
                 G_DOM_ELEMENTS.snippetGrid.innerHTML = '<p class="GRID__message">No script snippets found in the configuration.</p>';
                 return;
            }
            
            G_DOM_ELEMENTS.snippetGrid.innerHTML = ''; // Clear loading/error message

            const scriptKeys = Object.keys(scripts);
            scriptKeys.forEach(key => {
                const scriptData = scripts[key];
                const cardElement = createSnippetCard(scriptData, key);
                G_DOM_ELEMENTS.snippetGrid.appendChild(cardElement);
                
                // Find elements within the specific card for the fetch call
                const codeElement = cardElement.querySelector(`#code-${key}`);
                const copyCodeButton = cardElement.querySelector('.BTNS__item--code'); // Find the code copy button

                // Initiate fetch & highlight
                 setTimeout(() => { // Debounce slightly
                     fetchAndDisplayCode(scriptData, codeElement, copyCodeButton);
                 }, 0); 
            });
             console.log(`Rendered ${scriptKeys.length} snippet card placeholders.`);
        }


        // =============================================================================================
        // INITIALIZATION | MAIN APPLICATION INIT
        // - Updated in v1.1.0 (now async for config fetch)
        // =============================================================================================
        async function initApp() {
            const appVersion = document.querySelector('meta[name="application-version"]')?.content || 'N/A';
            console.log(`Initializing Coding Utility Scripts Viewer v${appVersion}...`); 

            // --- Cache DOM Elements ---
            G_DOM_ELEMENTS.snippetGrid = document.getElementById('snippet-grid');
            G_DOM_ELEMENTS.gridMessage = document.getElementById('grid-message');
            // Note: appTitle targeted by ID directly in injectVersionNote

            // --- Check Essential Elements ---
            if (!G_DOM_ELEMENTS.snippetGrid || !G_DOM_ELEMENTS.gridMessage) {
                 document.body.innerHTML = '<p class="GRID__message GRID__message--error">Error: Core application HTML elements (grid/message area) are missing.</p>';
                 return; 
            }
             
            // --- Inject Version Note ---
             injectVersionNote(); // Still using ID target here

            // --- Fetch Configuration Data ---
             G_APP_CONFIG_DATA = await fetchConfigData(G_CONFIG_JSON_URL);

            // --- Render Grid ONLY if Config Loaded ---
             if (G_APP_CONFIG_DATA) {
                 renderSnippetGrid(G_APP_CONFIG_DATA); 
             } else {
                 console.error("Initialization halted due to configuration load failure.");
                 // Error message already displayed by fetchConfigData
             }

             console.log("App Initialization Sequence Complete.");
        }

        // =============================================================================================
        // LISTENER | DOM CONTENT LOADED
        // - Unchanged, triggers async initApp
        // =============================================================================================
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
