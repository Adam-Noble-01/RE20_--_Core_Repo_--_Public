    FILE NAME    |  RE20_11_01_--_Index_-_Coding-Utility-Scripts.html (Suggested Name)

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    SCRIPT DESCRIPTION

    This HTML file contains the complete code for the Coding Utility Scripts Viewer.
    It integrates HTML, CSS, and JavaScript into a single file to provide functionalities including:
    - Reading configuration data from an embedded JSON object (`G_APP_CONFIG_DATA`).
    - Dynamically generating a grid of code snippet cards based on the JSON data.
    - Fetching the actual code content for each snippet from its specified GitHub URL using the `fetch` API.
    - Displaying snippet metadata (name, description, type, etc.).
    - Rendering the fetched code within a `<pre><code>` block.
    - Providing a "Copy Code" button for each snippet that uses the `navigator.clipboard` API.
    - Displaying loading and error states during code fetching and copying.
    - Injecting the application version (from meta tag) into the header title.
    - Adherence to the "RE10_20_01-_SCHEMA_-_Core-Web-Dev-Code-Conventions.txt" standard (based on provided example).

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    ISSUES & LESSONS LEARNED  

    - CORS Requirement: Fetching code from external URLs (like raw.githubusercontent.com) requires the HTML file 
      to be served over HTTP/HTTPS, not opened directly via `file:///`. Use a local web server for testing/use.
    - Network Dependency: Relies on network access to GitHub to fetch code snippets. Offline use or GitHub downtime 
      will prevent code from loading.
    - Clipboard API Limitations: The `navigator.clipboard.writeText` API requires a secure context (HTTPS or localhost) 
      and might require user permission prompts in some browsers. May fail in older browsers or insecure contexts.
    - JSON Structure Dependency: The script assumes the specific structure of the embedded `G_APP_CONFIG_DATA` JSON. 
      Changes to the JSON structure (key names) will break the script.
    - No Syntax Highlighting: Code is displayed as plain text. Implementing syntax highlighting would require adding 
      a third-party library (like Prism.js or Highlight.js) and more complex JS.
    - Basic Error Handling: Provides simple console logs and UI messages for fetch/copy errors. More robust error 
      handling could be implemented.

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    LOGIC ARCHITECTURE

    1. Data Embedding: JSON configuration is stored directly in the `G_APP_CONFIG_DATA` JavaScript variable.
    2. Initialization (`initApp` on DOMContentLoaded):
        - Caches essential DOM elements (header title, grid container).
        - Injects the application version into the header using `injectVersionNote`.
        - Calls `renderSnippetGrid` to start the rendering process.
    3. Grid Rendering (`renderSnippetGrid`):
        - Accesses `G_APP_CONFIG_DATA['script-files-data']`.
        - Iterates through each script entry in the JSON data.
        *   For each script: Creates an HTML card element (`createSnippetCard`).
            *   Populates the card with metadata (name, description, etc.).
            *   Appends the card to the grid container.
            *   Calls `fetchAndDisplayCode` asynchronously to load the actual code for that card.
    4. Code Fetching (`fetchAndDisplayCode`):
        - Takes the script data object and the target `code` element as arguments.
        - Displays a "Loading..." message.
        - Uses `fetch()` to retrieve code from `script-file-github-url`.
        - Handles fetch response (success/error).
        - On success: Sets the `textContent` of the `code` element. Enables the associated copy button.
        - On error: Displays an error message in the `code` element. Disables the copy button.
    5. Copy Functionality (`handleCopyClick`):
        - Attached dynamically to each "Copy Code" button.
        - Finds the associated `<code>` element.
        - Reads its `textContent`.
        - Uses `navigator.clipboard.writeText()` to copy the content.
        - Provides visual feedback on the button ("Copied!" / "Error").

    - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
    VISUAL JAVASCRIPT FUNCTION FLOW (Simplified)

    DOMContentLoaded -> initApp()
        ├── Cache DOM Elements (G_DOM_ELEMENTS)
        ├── injectVersionNote() -> Updates #app-title
        └── renderSnippetGrid()
            ├── Loop through G_APP_CONFIG_DATA['script-files-data']
            │   ├── createSnippetCard(scriptData) -> cardElement
            │   │   └── Adds metadata, pre/code block, copy button
            │   ├── Append cardElement to #snippet-grid
            │   └── fetchAndDisplayCode(scriptData, codeElement, copyButton) (async)
            │       ├── fetch(scriptData['script-file-github-url'])
            │       ├── Update codeElement.textContent (on success/error)
            │       └── Add EventListener to copyButton -> handleCopyClick()
            │           └── navigator.clipboard.writeText(codeText) -> Feedback
            └── (Grid Populates Asynchronously)

    <script>
        // =============================================================================================
        // JAVASCRIPT | GLOBAL VARIABLES & CONSTANTS

        // Defines global constants and caches frequently accessed DOM elements.
        // =============================================================================================
        const G_DOM_ELEMENTS = {
            appTitle: null,
            snippetGrid: null,
        };

        // =============================================================================================
        // JAVASCRIPT | HELPER FUNCTIONS

        // ------------------------------------------------------------
        // HELPER FUNCTION | INJECT VERSION NOTE
        // - Reused from provided example, adapted for current app
        // DESCRIPTION
        // - Dynamically reads the application version from the meta tag and adds a styled
        //   version note into the application title element (#app-title).
        // ------------------------------------------------------------
         function injectVersionNote(options = {}) {
             const config = {
                metaTagName: options.metaTagName || 'application-version',
                targetElementId: options.targetElementId || 'app-title',
                prefix: options.prefix !== undefined ? options.prefix : ' - v', 
                suffix: options.suffix !== undefined ? options.suffix : '',
                style: options.style || {
                    fontSize: '12px',
                    color: '#656565',
                    fontWeight: 'normal'
                }
            };

            const targetElement = G_DOM_ELEMENTS.appTitle; 
             if (!targetElement) {
                console.error(`Error: Target element #${config.targetElementId} not found for injecting version note.`);
                return;
            }

            const metaTag = document.querySelector(`meta[name="${config.metaTagName}"]`);
            if (!metaTag) {
                console.warn(`Warning: Meta tag with name="${config.metaTagName}" not found. Cannot inject version note.`);
                return;
            }
            const versionString = metaTag.getAttribute('content');
            if (!versionString) {
                 console.warn(`Warning: Meta tag "${config.metaTagName}" found, but has no content attribute.`);
                return;
            }
            console.log(`Injecting version: ${versionString}`);

            let baseTitle = '';
            for (let i = 0; i < targetElement.childNodes.length; i++) {
                if (targetElement.childNodes[i].nodeType === Node.TEXT_NODE) {
                    baseTitle = targetElement.childNodes[i].textContent.trim();
                    break;
                }
            }
             if (!baseTitle) { 
                 baseTitle = targetElement.textContent.split(config.prefix.trim())[0].trim() || 'App';
                 console.warn(`#${config.targetElementId} base text determined via fallback.`);
             }

            const versionSpan = document.createElement('span');
            versionSpan.className = 'version-note';
            versionSpan.textContent = `${config.prefix}${versionString}${config.suffix}`;

            for (const property in config.style) {
                if (config.style.hasOwnProperty(property)) {
                    versionSpan.style[property] = config.style[property];
                }
            }

            targetElement.innerHTML = ''; 
            targetElement.appendChild(document.createTextNode(baseTitle));
            targetElement.appendChild(versionSpan); 
        }

        // ------------------------------------------------------------
        // HELPER FUNCTION | CREATE SNIPPET CARD ELEMENT
        // - Introduced in v1.0.0
        // DESCRIPTION
        // - Creates the HTML structure for a single snippet card using data from a script object.
        // ARGUMENTS
        // - scriptData (Object): The object containing data for one script from the JSON config.
        // - scriptKey (String): The key used for this script in the JSON (e.g., "tool-script-01").
        // RETURNS
        // - (HTMLElement): The generated div element representing the snippet card.
        // ------------------------------------------------------------
        function createSnippetCard(scriptData, scriptKey) {
            const card = document.createElement('div');
            card.className = 'snippet-card';
            card.id = `snippet-${scriptKey}`; // Add unique ID for linking if needed

            const title = document.createElement('h3');
            title.textContent = scriptData['script-file-name'] || 'Unnamed Snippet';

            const copyButton = document.createElement('button');
            copyButton.className = 'copy-button';
            copyButton.textContent = 'Copy Code';
            copyButton.title = 'Copy code snippet to clipboard';
            copyButton.disabled = true; // Disabled until code loads

            const description = document.createElement('p');
            description.innerHTML = `<strong>Description:</strong> ${scriptData['script-file-description'] || 'No description available.'}`;

            const usage = document.createElement('p');
            usage.innerHTML = `<strong>Usage:</strong> ${scriptData['script-file-usage'] || 'No usage information available.'}`;
           
            const metaInfo = document.createElement('div');
            metaInfo.className = 'meta-info';
            metaInfo.innerHTML = `
                <span><strong>Type:</strong> ${scriptData['script-file-type'] || 'N/A'}</span>
                <span><strong>Version:</strong> ${scriptData['script-file-version'] || 'N/A'}</span>
                <span><strong>Added:</strong> ${scriptData['script-file-added'] || 'N/A'}</span>
            `;

            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.className = 'status-message'; // Initial class for loading message
            code.textContent = 'Loading code...'; 
            // Associate button with code element for easy access in event handler
            copyButton.dataset.codeElementId = `code-${scriptKey}`; 
            code.id = `code-${scriptKey}`;

            pre.appendChild(code);
            
            // Append elements to card
            card.appendChild(copyButton); // Add button first for positioning
            card.appendChild(title);
            card.appendChild(description);
            card.appendChild(usage);
            card.appendChild(metaInfo);
            card.appendChild(pre); // Add pre/code block last

            // Attach event listener to the button
            copyButton.addEventListener('click', handleCopyClick);

            return card; // Return the fully constructed card element
        }

        // ------------------------------------------------------------
        // HELPER FUNCTION | FETCH AND DISPLAY CODE
        // - Introduced in v1.0.0
        // DESCRIPTION
        // - Asynchronously fetches code from the provided URL and updates the target code element.
        // - Handles loading states, errors, and enables the copy button on success.
        // ARGUMENTS
        // - scriptData (Object): The script's data object containing the github URL.
        // - codeElement (HTMLElement): The `<code>` element to display the fetched code in.
        // - copyButton (HTMLElement): The corresponding "Copy Code" button.
        // ------------------------------------------------------------
        async function fetchAndDisplayCode(scriptData, codeElement, copyButton) {
            const url = scriptData['script-file-github-url'];
            
            if (!url) {
                console.error(`No GitHub URL found for script: ${scriptData['script-file-name']}`);
                codeElement.textContent = 'Error: Missing GitHub URL in config.';
                codeElement.className = 'error-message'; // Set error class
                copyButton.disabled = true;
                return;
            }
            
            if (!codeElement || !copyButton) {
                 console.error(`Missing codeElement or copyButton for URL: ${url}`);
                 return; // Should not happen if called correctly
            }

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    // Handle HTTP errors (e.g., 404 Not Found)
                    throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                }

                const codeText = await response.text();
                
                codeElement.textContent = codeText; // Display the fetched code
                codeElement.className = ''; // Remove status/error class
                copyButton.disabled = false; // Enable the copy button
                console.log(`Successfully fetched code for: ${scriptData['script-file-name']}`);

            } catch (error) {
                console.error(`Failed to fetch code from ${url}:`, error);
                codeElement.textContent = `Error loading code: ${error.message}\nURL: ${url}`;
                codeElement.className = 'error-message'; // Set error class
                copyButton.disabled = true; // Keep button disabled on error
            }
        }


        // =============================================================================================
        // JAVASCRIPT | EVENT HANDLERS
        // - Introduced in v1.0.0
        // Contains functions that handle specific user interactions (button clicks).
        // =============================================================================================

        // ------------------------------------------------------------
        // EVENT HANDLER | COPY BUTTON CLICK
        // - Introduced in v1.0.0
        // DESCRIPTION
        // - Handles the click event for the "Copy Code" button.
        // - Finds the associated code block, copies its content to the clipboard, 
        //   and provides visual feedback on the button.
        // ------------------------------------------------------------
        async function handleCopyClick(event) {
            const button = event.target;
            const codeElementId = button.dataset.codeElementId;
            const codeElement = document.getElementById(codeElementId);

            if (!codeElement) {
                console.error("Could not find code element with ID:", codeElementId);
                button.textContent = 'Error';
                button.classList.add('copy-error');
                return;
            }

            const codeToCopy = codeElement.textContent;
            const originalButtonText = button.textContent; // Store original text

            try {
                 // Check if clipboard API is available and context is secure
                if (!navigator.clipboard || !window.isSecureContext) {
                     console.warn('Clipboard API not available or context is insecure. Falling back to older method (if implemented) or showing error.');
                     // Implement fallback here if needed (e.g., using document.execCommand - deprecated)
                     throw new Error('Secure context or Clipboard API unavailable.');
                 }

                await navigator.clipboard.writeText(codeToCopy);
                console.log('Code copied to clipboard!');
                
                // Visual Feedback: Success
                button.textContent = 'Copied!';
                button.classList.add('copied');
                button.classList.remove('copy-error'); // Ensure error style is removed

                // Reset button text after a short delay
                setTimeout(() => {
                    button.textContent = originalButtonText;
                    button.classList.remove('copied');
                }, 2000); // Reset after 2 seconds

            } catch (err) {
                console.error('Failed to copy code:', err);
                
                // Visual Feedback: Error
                button.textContent = 'Copy Failed';
                button.classList.add('copy-error');
                button.classList.remove('copied'); // Ensure success style is removed

                 // Reset button text after a short delay
                 setTimeout(() => {
                    button.textContent = originalButtonText;
                    button.classList.remove('copy-error');
                }, 3000); // Keep error message slightly longer
            }
        }

        // =============================================================================================
        // JAVASCRIPT | CORE LOGIC FUNCTIONS
        // - Introduced in v1.0.0
        // Contains the main functions driving the application's core behavior.
        // =============================================================================================

        // ------------------------------------------------------------
        // CORE FUNCTION | RENDER SNIPPET GRID
        // - Introduced in v1.0.0
        // DESCRIPTION
        // - Clears the existing grid content.
        // - Iterates through the script data in the config JSON.
        // - Creates a snippet card for each script.
        // - Appends the card to the grid.
        // - Initiates the asynchronous fetching of code for each card.
        // ------------------------------------------------------------
        function renderSnippetGrid() {
            if (!G_DOM_ELEMENTS.snippetGrid) {
                console.error("Snippet grid container not found.");
                return;
            }
            if (!G_APP_CONFIG_DATA || !G_APP_CONFIG_DATA['script-files-data']) {
                 console.error("Configuration data or script-files-data is missing.");
                 G_DOM_ELEMENTS.snippetGrid.innerHTML = '<p style="color: red;">Error: Configuration data is missing or invalid.</p>';
                 return;
            }

            // Clear any existing content (like the "Loading..." message)
            G_DOM_ELEMENTS.snippetGrid.innerHTML = '';

            const scripts = G_APP_CONFIG_DATA['script-files-data'];
            const scriptKeys = Object.keys(scripts);

            if (scriptKeys.length === 0) {
                 G_DOM_ELEMENTS.snippetGrid.innerHTML = '<p>No script snippets found in the configuration.</p>';
                 return;
            }

            // Loop through each script entry
            scriptKeys.forEach(key => {
                const scriptData = scripts[key];
                
                // 1. Create the card structure
                const cardElement = createSnippetCard(scriptData, key);
                
                // 2. Append the card to the grid
                G_DOM_ELEMENTS.snippetGrid.appendChild(cardElement);
                
                // 3. Find the code element and button within the newly added card
                const codeElement = cardElement.querySelector(`#code-${key}`);
                const copyButton = cardElement.querySelector('.copy-button'); // Find by class within the card

                // 4. Initiate the asynchronous fetch for this card's code
                //    Use setTimeout to avoid blocking the main thread during initial render loop, 
                //    allowing the UI to update faster with placeholders.
                setTimeout(() => {
                    fetchAndDisplayCode(scriptData, codeElement, copyButton);
                }, 0); 
            });
             console.log(`Rendered ${scriptKeys.length} snippet card placeholders.`);
        }


        // =============================================================================================
        // INITIALIZATION | MAIN APPLICATION INIT
        // - Introduced in v1.0.0
        // DESCRIPTION
        // - Sets up the application on page load: caches DOM elements, injects version note,
        //   and triggers the rendering of the snippet grid.
        // =============================================================================================
        function initApp() {
            console.log(`Initializing Coding Utility Scripts Viewer v${document.querySelector('meta[name="application-version"]')?.content || 'N/A'}...`); 

            // --- Cache DOM Elements ---
            G_DOM_ELEMENTS.appTitle = document.getElementById('app-title');
            G_DOM_ELEMENTS.snippetGrid = document.getElementById('snippet-grid');

            // --- Check if all essential elements were found ---
            let essentialElementsFound = true;
             for (const key in G_DOM_ELEMENTS) {
                if (G_DOM_ELEMENTS[key] === null) {
                     console.error(`Initialization Error: DOM element for '${key}' not found.`);
                     essentialElementsFound = false;
                }
             }

             if (!essentialElementsFound) {
                 document.body.innerHTML = '<p style="color: red; font-weight: bold; padding: 20px;">Error: Application could not initialize. Essential HTML elements are missing. Check the console for details.</p>';
                 return; // Stop initialization
             }
             
             // --- Inject Version Note ---
             injectVersionNote(); // Use default settings

            // --- Render the Snippet Grid ---
            renderSnippetGrid(); 

             console.log("Coding Utility Scripts Viewer Initialized Successfully.");
        }

        // =============================================================================================
        // LISTENER | DOM CONTENT LOADED
        // - Introduced in v1.0.0
        // DESCRIPTION
        // - Ensures the DOM is fully parsed before running the main initialization script.
        // =============================================================================================
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
